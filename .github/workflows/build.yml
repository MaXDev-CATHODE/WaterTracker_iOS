name: Build WaterTracker IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14   # Xcode 15 is available on macos-14

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode 15 ───────────────────────────────────────────────────
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # ── 3. Install XcodeGen ──────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj from project.yml ──────────────────────────────
      - name: Generate Xcode project
        run: xcodegen generate

      # ── 5. Resolve Swift Package dependencies ────────────────────────────────
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WaterTracker.xcodeproj \
            -scheme WaterTracker

      # ── 6. Build (no signing) ────────────────────────────────────────────────
      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project WaterTracker.xcodeproj \
            -scheme WaterTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build/DerivedData

      # ── 7. Package .app into unsigned .ipa ───────────────────────────────────
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "WaterTracker.app" -not -path "*/Test*" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/WaterTracker.app
          cd build
          zip -r WaterTracker-unsigned.ipa Payload
          echo "IPA created: $(du -sh WaterTracker-unsigned.ipa)"

      # ── 8. Upload IPA as artifact ─────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaterTracker-unsigned-ipa
          path: build/WaterTracker-unsigned.ipa
          retention-days: 30
