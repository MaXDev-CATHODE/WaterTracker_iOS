name: Build WaterTracker IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode 16 ───────────────────────────────────────────────────
      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer
          xcodebuild -version

      # ── 3. Install XcodeGen ──────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj ───────────────────────────────────────────────
      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          echo "Generated files:"
          ls -la

      # ── 5. List schemes ───────────────────────────────────────────────────────
      - name: List schemes and targets
        run: |
          echo "=== xcodebuild -list ==="
          xcodebuild -project WaterTracker.xcodeproj -list 2>&1 || true
          echo ""
          echo "=== PBXNativeTarget names ==="
          grep -A2 "isa = PBXNativeTarget" WaterTracker.xcodeproj/project.pbxproj | grep "name = " || true
          echo ""
          echo "=== All target names ==="
          grep "name = " WaterTracker.xcodeproj/project.pbxproj | grep -v "//" | head -30 || true

      # ── 6. Build WaterTracker app (no signing) ────────────────────────────────
      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project WaterTracker.xcodeproj \
            -target WaterTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build/DerivedData > build.log 2>&1
          BUILD_EXIT=$?
          echo "=== build.log (last 150 lines) ==="
          tail -150 build.log
          exit $BUILD_EXIT

      # ── 7. Package .app into unsigned .ipa ───────────────────────────────────
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "WaterTracker.app" \
            -not -path "*/Test*" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/WaterTracker.app
          cd build
          zip -r WaterTracker-unsigned.ipa Payload
          echo "IPA size: $(du -sh WaterTracker-unsigned.ipa)"

      # ── 8. Upload IPA as artifact ─────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaterTracker-unsigned-ipa
          path: build/WaterTracker-unsigned.ipa
          retention-days: 30

      # ── 9. Upload build log on failure ───────────────────────────────────────
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
