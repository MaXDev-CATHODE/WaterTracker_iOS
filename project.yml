name: WaterTracker
options:
  bundleIdPrefix: com.8FXQF8BCX4
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_BITCODE: NO

targets:
  WaterTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaterTracker
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
      - path: Shared/WaterLogic.swift
      - path: Shared/AppGroupStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.watertracker
        INFOPLIST_FILE: WaterTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: WaterTracker/WaterTracker.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    entitlements:
      path: WaterTracker/WaterTracker.entitlements

  WaterTrackerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaterTrackerWidget
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
      - path: Shared/WaterLogic.swift
      - path: Shared/AppGroupStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.8FXQF8BCX4.watertracker.widget
        INFOPLIST_FILE: WaterTrackerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WaterTrackerWidget/WaterTrackerWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: WaterTrackerWidget/WaterTrackerWidget.entitlements

schemes:
  WaterTracker:
    build:
      targets:
        WaterTracker: all
        WaterTrackerWidget: all
    run:
      config: Debug
    archive:
      config: Release
