name: WaterTracker
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  WaterTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaterTracker
        excludes:
          - "**/*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.watertracker
        INFOPLIST_FILE: WaterTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: WaterTracker/WaterTracker.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: WaterTracker/WaterTracker.entitlements
    dependencies:
      - target: WaterTrackerWidget
        embed: true

  WaterTrackerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaterTrackerWidget
        excludes:
          - "**/*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.watertracker.widget
        INFOPLIST_FILE: WaterTrackerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WaterTrackerWidget/WaterTrackerWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: NO
    entitlements:
      path: WaterTrackerWidget/WaterTrackerWidget.entitlements

  WaterTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaterTrackerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.watertrackertests
        INFOPLIST_FILE: ""
    dependencies:
      - target: WaterTracker
      - package: SwiftCheck
    scheme:
      testTargets:
        - WaterTrackerTests

packages:
  SwiftCheck:
    url: https://github.com/typelift/SwiftCheck.git
    exactVersion: "0.12.0"

schemes:
  WaterTracker:
    build:
      targets:
        WaterTracker: all
        WaterTrackerWidget: all
        WaterTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WaterTrackerTests
    archive:
      config: Release
